name: Check Extension

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main: a PR stacked on another
  # feature branch is exactly the change most worth checking, and filtering on
  # the base branch silently gives it no CI at all.
  pull_request:

# No job here writes to the repository; a compromised action or dependency gets a read-only token.
permissions:
  contents: read

env:
  # The default mirror (https://mirror.mage-os.org/) only proxies magento/* packages; the
  # mage-os/project-community-edition metapackage is published to https://repo.mage-os.org/.
  # Without this, composer fails with "Could not find package mage-os/project-community-edition".
  MAGE_OS_REPOSITORY: https://repo.mage-os.org/

jobs:
  # Resolved fresh on every run, since this repo keeps no lock file: it audits what a store
  # installing the module today would get. Abandoned packages are reported, not failed on, because
  # the ones flagged come from Magento core, which this module cannot change.
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
      - name: Resolve dependencies without installing them
        run: composer update --no-install --no-interaction --no-progress
      - name: Audit resolved dependencies
        run: composer audit --locked --no-dev --abandoned=report

  compute-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.supported.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: graycoreio/github-actions-magento2/supported-version@a65d0e50647829a9f6f972d72d87054a9c848fe0 # v8.9.0
        id: supported
        with:
          project: mage-os
          # The newest Mage-OS release. "currently-supported" resolved to an older 3.x release,
          # while the E2E workflow already runs the newest one.
          kind: latest

  # The oldest combination composer.json allows: Magento Open Source 2.4.8 (magento/framework
  # 103.0.8) on PHP 8.2. The Mage-OS matrix above only covers current Mage-OS on the PHP version
  # the action picks, so without this the floor would never see the unit, integration or compile
  # jobs. 2.4.7 cannot be the floor: its project template requires MFTF 4.7 (symfony/event-dispatcher
  # ^6.4) next to allure-phpunit ^2, which leaves no event-dispatcher symfony/ai-platform accepts.
  # Raise this together with the magento/framework and php constraints, never on its own.
  compute-lowest-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.lowest.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: graycoreio/github-actions-magento2/supported-version@a65d0e50647829a9f6f972d72d87054a9c848fe0 # v8.9.0
        id: supported
        with:
          project: magento-open-source
          kind: custom
          custom_versions: 'magento/project-community-edition:2.4.8'
      - name: Pin the matrix to the lowest PHP version composer.json allows
        id: lowest
        env:
          MATRIX: ${{ steps.supported.outputs.matrix }}
        run: |
          echo "$MATRIX" | jq .
          echo "matrix=$(echo "$MATRIX" | jq -c 'walk(if type == "object" and has("php") then .php = "8.2" else . end)')" >> "$GITHUB_OUTPUT"

  # The reusable workflow below has no static-analysis job, so this runs one. It installs the
  # module standalone rather than inside a Magento project, because phpstan only needs the
  # framework classes on the autoloader, not a working install.
  #
  # bitexpert/phpstan-magento is what makes this viable at all: without it, every reference to
  # an auto-generated *Factory is an unknown class and level 0 alone reports 58 errors.
  static-analysis:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  # The reusable workflow below runs the unit suite inside a Magento install, which has
  # symfony/ai-platform and the OpenAI and Anthropic bridges now that composer.json requires
  # them. That job only runs the PHP versions the Magento matrix pairs with each release,
  # though. This one runs the chat client tests standalone across the full PHP range
  # composer.json claims to support, so the 8.2 floor and the newest PHP are exercised against
  # the newest symfony/ai 0.15 release too.
  unit-tests-with-ai-platform:
    name: Unit tests with symfony/ai-platform (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      # Nothing in this suite skips itself any more; --fail-on-skipped keeps it that way, so a
      # skip that creeps back in cannot turn this job green while it verifies nothing.
      - name: Run tests that need the AI platform
        run: vendor/bin/phpunit -c phpunit.xml.dist --testsuite Platform --fail-on-skipped

  # The unit, compile and integration jobs of graycoreio's check-extension workflow, for Mage-OS.
  # That reusable workflow cannot be used here: Mage-OS ships Mago, which requires this module at
  # ^1.0, and the workflow requires the checkout as dev-main from a canonical path repository, so
  # nothing satisfies Mago. These jobs stamp the checkout with the released version first (see
  # .github/actions/require-checkout). Its coding-standard job runs in check-extension-lowest.
  compute-mage-os-jobs:
    needs: compute-matrix
    runs-on: ubuntu-latest
    outputs:
      resolved: ${{ steps.resolve.outputs.resolved }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: graycoreio/github-actions-magento2/resolve-check-config@a65d0e50647829a9f6f972d72d87054a9c848fe0 # v8.9.0
        id: resolve
        with:
          kind: extension
          matrix: ${{ needs.compute-matrix.outputs.matrix }}

  mage-os-unit-tests:
    name: Unit tests (${{ matrix.magento }})
    needs: compute-mage-os-jobs
    if: ${{ fromJSON(needs.compute-mage-os-jobs.outputs.resolved)['unit-test-extension'].enabled != false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-mage-os-jobs.outputs.resolved)['unit-test-extension'].matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: graycoreio/github-actions-magento2/setup-magento@a65d0e50647829a9f6f972d72d87054a9c848fe0 # v8.9.0
        id: setup-magento
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v${{ matrix.composer }}
          mode: extension
          magento_version: ${{ matrix.magento }}
          magento_repository: ${{ env.MAGE_OS_REPOSITORY }}

      - uses: ./.github/actions/require-checkout
        with:
          magento-path: ${{ steps.setup-magento.outputs.path }}

      - name: Composer install
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: composer install
        env:
          COMPOSER_MIRROR_PATH_REPOS: 1

      - name: Register the module's unit tests
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: |
          cat > /tmp/testsuite.xml << 'EOF'
                  <testsuite name="Extension_Unit_Tests">
                      <directory>../../../vendor/mage-os/module-ai-base/Test/Unit</directory>
                  </testsuite>
          EOF
          sed -i '/<testsuites>/r /tmp/testsuite.xml' dev/tests/unit/phpunit.xml.dist
          sed -i '/<extensions>/,/<\/extensions>/d' dev/tests/unit/phpunit.xml.dist

      - name: Run unit tests
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: vendor/bin/phpunit -c dev/tests/unit/phpunit.xml.dist --testsuite Extension_Unit_Tests

  mage-os-compile:
    name: Compile (${{ matrix.magento }})
    needs: compute-mage-os-jobs
    if: ${{ fromJSON(needs.compute-mage-os-jobs.outputs.resolved)['compile-extension'].enabled != false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-mage-os-jobs.outputs.resolved)['compile-extension'].matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: graycoreio/github-actions-magento2/setup-magento@a65d0e50647829a9f6f972d72d87054a9c848fe0 # v8.9.0
        id: setup-magento
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v${{ matrix.composer }}
          mode: extension
          magento_version: ${{ matrix.magento }}
          magento_repository: ${{ env.MAGE_OS_REPOSITORY }}

      - uses: ./.github/actions/require-checkout
        with:
          magento-path: ${{ steps.setup-magento.outputs.path }}

      - name: Composer install
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: composer install
        env:
          COMPOSER_MIRROR_PATH_REPOS: 1

      - uses: graycoreio/github-actions-magento2/setup-di-compile@a65d0e50647829a9f6f972d72d87054a9c848fe0 # v8.9.0
        with:
          path: ${{ steps.setup-magento.outputs.path }}

  mage-os-integration-tests:
    name: Integration tests (${{ matrix.magento }})
    needs: compute-mage-os-jobs
    if: ${{ fromJSON(needs.compute-mage-os-jobs.outputs.resolved)['integration_test'].enabled != false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-mage-os-jobs.outputs.resolved)['integration_test'].matrix }}
    services: ${{ matrix.services }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: graycoreio/github-actions-magento2/setup-magento@a65d0e50647829a9f6f972d72d87054a9c848fe0 # v8.9.0
        id: setup-magento
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v${{ matrix.composer }}
          mode: extension
          magento_version: ${{ matrix.magento }}
          magento_repository: ${{ env.MAGE_OS_REPOSITORY }}

      - uses: ./.github/actions/require-checkout
        with:
          magento-path: ${{ steps.setup-magento.outputs.path }}

      - name: Composer install
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: composer install
        env:
          COMPOSER_MIRROR_PATH_REPOS: 1

      - name: Point the integration config at the service containers
        working-directory: ${{ steps.setup-magento.outputs.path }}/dev/tests/integration
        run: |
          sed -i "s/'db-host' => 'localhost'/'db-host' => '127.0.0.1'/" etc/install-config-mysql.php.dist
          sed -i "s/'db-user' => 'root'/'db-user' => 'user'/" etc/install-config-mysql.php.dist
          sed -i "s/'db-password' => '123123q'/'db-password' => 'password'/" etc/install-config-mysql.php.dist
          sed -i "s/'elasticsearch-host' => 'localhost'/'elasticsearch-host' => '127.0.0.1'/" etc/install-config-mysql.php.dist
          sed -i "s/'amqp-host' => 'localhost'/'amqp-host' => '127.0.0.1'/" etc/install-config-mysql.php.dist

      - name: Enable log-bin-trust-function-creators
        run: mysql -h127.0.0.1 -uroot -prootpassword -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Register the module's integration tests
        working-directory: ${{ steps.setup-magento.outputs.path }}
        run: |
          cat > /tmp/testsuite.xml << 'EOF'
                  <testsuite name="Extension_Integration_Tests">
                      <directory>../../../vendor/mage-os/module-ai-base/Test/Integration</directory>
                  </testsuite>
          EOF
          sed -i '/<testsuites>/r /tmp/testsuite.xml' dev/tests/integration/phpunit.xml.dist

      - name: Run integration tests
        working-directory: ${{ steps.setup-magento.outputs.path }}/dev/tests/integration
        run: ../../../vendor/bin/phpunit -c phpunit.xml.dist --testsuite Extension_Integration_Tests

  check-extension-lowest:
    needs: compute-lowest-matrix
    uses: graycoreio/github-actions-magento2/.github/workflows/check-extension.yaml@a65d0e50647829a9f6f972d72d87054a9c848fe0 # v8.9.0
    with:
      matrix: ${{ needs.compute-lowest-matrix.outputs.matrix }}
